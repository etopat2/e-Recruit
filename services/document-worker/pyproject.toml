[project]
name = "ups-erecruit-document-worker"
version = "1.0.0"
description = "Bounded OCR and document quality worker for UPS e-Recruit"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pymupdf==1.26.3",
  "python-multipart==0.0.20",
  "pytesseract==0.3.13",
  "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]
